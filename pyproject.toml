[project]
name = "jev-support-desk"
version = "0.1.0"
description = "Developer-support queue tooling built on TypeSafe's Jev: confidence-gated triage, misroute monitoring, shift handoffs, and a request doctor."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "typesafe-sdk==0.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
jev-desk = "jev_support_desk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_support_desk"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
